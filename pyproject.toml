[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-mcp-evals-workshop"
version = "0.1.0"
description = "Offline workshop on agents, a tiny MCP teaching server, and invariant evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Lescano" }]
keywords = ["agents", "mcp", "evals", "workshop"]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
workshop = "workshop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workshop = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src", "tests", "exercises", "solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "exercises", "solutions"]
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=workshop --cov-report=term-missing --cov-fail-under=80"
